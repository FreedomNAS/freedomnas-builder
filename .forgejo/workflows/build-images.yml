name: build-images

# Triggered manually, or by core/profiles/webui's notify-image-builder.yml
# calling this repo's workflow_dispatch API on every push to their main.
# Start it on the branch to build: on dev every repo is checked out at
# dev; on main (or master) at the newest release tag, vX.Y.Z.
#
# live-iso builds the live ISO once; the image jobs (debian, void, freebsd
# and artix, one image per init system) install from that same ISO,
# handed over in /var/tmp/freedomnas-ci/run-<id>/ on the runner, and
# cleanup removes that directory at the end whatever happened. On dev,
# freebsd-live-iso also builds the FreeBSD installer ISO. The ISOs and
# every image go to a release of the GitHub showcase repo
# FreedomNAS/freedomnas-image (ci/publish-release.sh) when the
# GH_RELEASE_TOKEN secret is set: one release per run, images-<run number>.
#
# Runs on a self-hosted runner, on the host, as root through sudo: QEMU/KVM
# (debian, void, artix: the live ISO installs them in a VM; freebsd and the
# FreeBSD live ISO boot FreeBSD's own VM image under QEMU) and the live ISO's chroot need what Codeberg's hosted
# runners don't grant -- see ../../docs/ci-setup.md. No pool is ever created
# or imported on the runner itself: they exist only inside the VMs.
on:
  workflow_dispatch: {}

env:
  CI_DIR: /var/tmp/freedomnas-ci/run-${{ github.run_id }}
  CHECKOUT_REF: ${{ github.ref || 'refs/heads/dev' }}
  FNAS_CHANNEL: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && 'main' || 'dev' }}

jobs:
  live-iso:
    runs-on: [self-hosted, image-builder]
    steps:
      # A run on main (or master) builds the newest release tag (vX.Y.Z,
      # the same name in every FreedomNAS repository), not the branches' tips.
      - name: Pick the ref to build
        run: |
          ref="$CHECKOUT_REF"
          case "$ref" in
            refs/heads/main|refs/heads/master)
              tag="$(git ls-remote --tags --refs https://codeberg.org/FreedomNAS/freedomnas-core.git 'v*' \
                | sed 's|.*refs/tags/||' | grep -E '^v[0-9]+(\.[0-9]+)*$' | sort -V | tail -n 1)"
              [ -n "$tag" ] || { echo "no release tag on freedomnas-core" >&2; exit 1; }
              ref="refs/tags/$tag" ;;
          esac
          echo "Building $ref"
          echo "SRC_REF=$ref" >> "$GITHUB_ENV"
          echo "SRC_NAME=${ref#refs/*/}" >> "$GITHUB_ENV"

      - name: Check out freedomnas-image-builder
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SRC_REF }}
          path: freedomnas-image-builder

      # A cancelled run may never reach its last steps, and the runner user
      # cannot stop what ran as root: whatever an earlier job left running
      # (emerge, QEMU, zstd) is stopped before this one starts.
      - name: Stop what an earlier job left running
        run: sudo sh freedomnas-image-builder/ci/stop-leftovers.sh

      # Sibling checkouts, at the ref picked above -- the build scripts
      # find freedomnas-<name> next to this repo. Without a
      # ref, actions/checkout asks GitHub's API for the default branch,
      # which Codeberg does not serve.
      - name: Check out freedomnas-profiles
        uses: actions/checkout@v4
        with:
          repository: FreedomNAS/freedomnas-profiles
          ref: ${{ env.SRC_REF }}
          path: freedomnas-profiles

      - name: Check out freedomnas-installer
        uses: actions/checkout@v4
        with:
          repository: FreedomNAS/freedomnas-installer
          ref: ${{ env.SRC_REF }}
          path: freedomnas-installer

      # The ISO carries FreedomNAS itself too (fnas_install_core, step 7).
      - name: Check out freedomnas-core
        uses: actions/checkout@v4
        with:
          repository: FreedomNAS/freedomnas-core
          ref: ${{ env.SRC_REF }}
          path: freedomnas-core

      - name: Check out freedomnas-webui
        uses: actions/checkout@v4
        with:
          repository: FreedomNAS/freedomnas-webui
          ref: ${{ env.SRC_REF }}
          path: freedomnas-webui

      - name: Check out freedomnas-docs
        uses: actions/checkout@v4
        with:
          repository: FreedomNAS/freedomnas-docs
          ref: ${{ env.SRC_REF }}
          path: freedomnas-docs

      # The live ISO's Portage tree carries it (live/build.sh, step 3).
      - name: Check out freedomnas-overlay
        uses: actions/checkout@v4
        with:
          repository: FreedomNAS/freedomnas-overlay
          ref: ${{ env.SRC_REF }}
          path: freedomnas-overlay

      # The plain ISO: build-ssh.sh's carries whoever built it's key and is
      # never published.
      - name: Build the live ISO
        run: |
          sudo env FNAS_CHANNEL="$FNAS_CHANNEL" freedomnas-image-builder/live/build.sh "$PWD/freedomnas-live.iso"
          sudo install -d -m 755 "$CI_DIR"
          sudo install -m 644 freedomnas-live.iso "$CI_DIR/freedomnas-live.iso"

      - name: Publish to the GitHub showcase
        env:
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          RELEASE_TAG: images-${{ github.run_number }}
          RELEASE_NAME: FreedomNAS images, build ${{ github.run_number }} (${{ env.SRC_NAME }})
        run: |
          if [ -z "$GH_RELEASE_TOKEN" ]; then
            echo "GH_RELEASE_TOKEN is not set: nothing published"
            exit 0
          fi
          sh freedomnas-image-builder/ci/publish-release.sh freedomnas-live.iso

      # The builds run as root and leave root-owned files in the workspace;
      # the runner, not root, could not delete them when the job ends, and
      # the next job would find a half-cleaned workspace.
      - name: Stop what this job left running
        if: always()
        run: sudo sh freedomnas-image-builder/ci/stop-leftovers.sh

      - name: Give the workspace back to the runner
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .

  images:
    name: Build ${{ matrix.image }} image
    needs: live-iso
    runs-on: [self-hosted, image-builder]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { edition: debian, image: debian }
          - { edition: void, image: void }
          - { edition: freebsd, image: freebsd }
          - { edition: artix, init: openrc, image: artix-openrc }
          - { edition: artix, init: dinit, image: artix-dinit }
          - { edition: artix, init: runit, image: artix-runit }
    steps:
      # A run on main (or master) builds the newest release tag (vX.Y.Z,
      # the same name in every FreedomNAS repository), not the branches' tips.
      - name: Pick the ref to build
        run: |
          ref="$CHECKOUT_REF"
          case "$ref" in
            refs/heads/main|refs/heads/master)
              tag="$(git ls-remote --tags --refs https://codeberg.org/FreedomNAS/freedomnas-core.git 'v*' \
                | sed 's|.*refs/tags/||' | grep -E '^v[0-9]+(\.[0-9]+)*$' | sort -V | tail -n 1)"
              [ -n "$tag" ] || { echo "no release tag on freedomnas-core" >&2; exit 1; }
              ref="refs/tags/$tag" ;;
          esac
          echo "Building $ref"
          echo "SRC_REF=$ref" >> "$GITHUB_ENV"
          echo "SRC_NAME=${ref#refs/*/}" >> "$GITHUB_ENV"

      - name: Check out freedomnas-image-builder
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SRC_REF }}
          path: freedomnas-image-builder

      # A cancelled run may never reach its last steps, and the runner user
      # cannot stop what ran as root: whatever an earlier job left running
      # (emerge, QEMU, zstd) is stopped before this one starts.
      - name: Stop what an earlier job left running
        run: sudo sh freedomnas-image-builder/ci/stop-leftovers.sh

      - name: Check out freedomnas-core
        uses: actions/checkout@v4
        with:
          repository: FreedomNAS/freedomnas-core
          ref: ${{ env.SRC_REF }}
          path: freedomnas-core

      - name: Check out freedomnas-profiles
        uses: actions/checkout@v4
        with:
          repository: FreedomNAS/freedomnas-profiles
          ref: ${{ env.SRC_REF }}
          path: freedomnas-profiles

      - name: Check out freedomnas-webui
        uses: actions/checkout@v4
        with:
          repository: FreedomNAS/freedomnas-webui
          ref: ${{ env.SRC_REF }}
          path: freedomnas-webui

      - name: Check out freedomnas-installer
        uses: actions/checkout@v4
        with:
          repository: FreedomNAS/freedomnas-installer
          ref: ${{ env.SRC_REF }}
          path: freedomnas-installer

      - name: Check out freedomnas-docs
        uses: actions/checkout@v4
        with:
          repository: FreedomNAS/freedomnas-docs
          ref: ${{ env.SRC_REF }}
          path: freedomnas-docs

      - name: Build the image
        run: |
          chmod +x freedomnas-image-builder/${{ matrix.edition }}/build.sh
          # The Linux editions install from live-iso's ISO (FNAS_LIVE_ISO);
          # FreeBSD boots mfsBSD under QEMU: VirtualBox, the script's
          # default, is not on the runner. sudo drops the environment, env
          # passes it.
          sudo env FNAS_LIVE_ISO="$CI_DIR/freedomnas-live.iso" FNAS_CHANNEL="$FNAS_CHANNEL" FREEBSD_BACKEND=qemu \
            freedomnas-image-builder/${{ matrix.edition }}/build.sh ${{ matrix.init }} \
            "$PWD/freedomnas-image-builder/${{ matrix.edition }}/${{ matrix.image }}.img"

      - name: Publish to the GitHub showcase
        env:
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          RELEASE_TAG: images-${{ github.run_number }}
          RELEASE_NAME: FreedomNAS images, build ${{ github.run_number }} (${{ env.SRC_NAME }})
        run: |
          if [ -z "$GH_RELEASE_TOKEN" ]; then
            echo "GH_RELEASE_TOKEN is not set: nothing published"
            exit 0
          fi
          sh freedomnas-image-builder/ci/publish-release.sh \
            "freedomnas-image-builder/${{ matrix.edition }}/${{ matrix.image }}.img.zst"

      - name: Stop what this job left running
        if: always()
        run: sudo sh freedomnas-image-builder/ci/stop-leftovers.sh

      - name: Give the workspace back to the runner
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .

  # The FreeBSD installer ISO (freebsd/live.sh): FreeBSD installs run from
  # FreeBSD, so it is a second live ISO, for machines that cannot take a
  # flashed image. Dev runs only for now.
  freebsd-live-iso:
    if: github.ref == 'refs/heads/dev'
    runs-on: [self-hosted, image-builder]
    steps:
      - name: Check out freedomnas-image-builder
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
          path: freedomnas-image-builder

      - name: Stop what an earlier job left running
        run: sudo sh freedomnas-image-builder/ci/stop-leftovers.sh

      - name: Check out freedomnas-profiles
        uses: actions/checkout@v4
        with:
          repository: FreedomNAS/freedomnas-profiles
          ref: ${{ env.CHECKOUT_REF }}
          path: freedomnas-profiles

      - name: Check out freedomnas-installer
        uses: actions/checkout@v4
        with:
          repository: FreedomNAS/freedomnas-installer
          ref: ${{ env.CHECKOUT_REF }}
          path: freedomnas-installer

      - name: Check out freedomnas-core
        uses: actions/checkout@v4
        with:
          repository: FreedomNAS/freedomnas-core
          ref: ${{ env.CHECKOUT_REF }}
          path: freedomnas-core

      - name: Check out freedomnas-webui
        uses: actions/checkout@v4
        with:
          repository: FreedomNAS/freedomnas-webui
          ref: ${{ env.CHECKOUT_REF }}
          path: freedomnas-webui

      - name: Check out freedomnas-docs
        uses: actions/checkout@v4
        with:
          repository: FreedomNAS/freedomnas-docs
          ref: ${{ env.CHECKOUT_REF }}
          path: freedomnas-docs

      - name: Build the FreeBSD live ISO
        run: |
          sudo env FNAS_CHANNEL="$FNAS_CHANNEL" FREEBSD_BACKEND=qemu \
            freedomnas-image-builder/freebsd/live.sh "$PWD/freedomnas-live-freebsd.iso"

      - name: Publish to the GitHub showcase
        env:
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          RELEASE_TAG: images-${{ github.run_number }}
          RELEASE_NAME: FreedomNAS images, build ${{ github.run_number }} (dev)
        run: |
          if [ -z "$GH_RELEASE_TOKEN" ]; then
            echo "GH_RELEASE_TOKEN is not set: nothing published"
            exit 0
          fi
          sh freedomnas-image-builder/ci/publish-release.sh freedomnas-live-freebsd.iso

      - name: Stop what this job left running
        if: always()
        run: sudo sh freedomnas-image-builder/ci/stop-leftovers.sh

      - name: Give the workspace back to the runner
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .

  cleanup:
    needs: [live-iso, images, freebsd-live-iso]
    if: always()
    runs-on: [self-hosted, image-builder]
    steps:
      - name: Check out freedomnas-image-builder
        uses: actions/checkout@v4
        with:
          path: freedomnas-image-builder

      - name: Stop what the run left running
        run: sudo sh freedomnas-image-builder/ci/stop-leftovers.sh

      - name: Remove this run's live ISO from the runner
        run: sudo rm -rf "$CI_DIR"

      - name: Give the workspace back to the runner
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .
